name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-flight: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          publish-dir: .
      - uses: actions/upload-pages-artifact@v8
        with:
          path: .
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4# Last updated: Thu Jul 30 10:24:09 CEST 2026
